name: ci
on: [push, pull_request, workflow_dispatch]
jobs:
  ip:
    uses: Tape-Out/.github/.github/workflows/ip.yml@main
    permissions:
      contents: write
    with:
      # 整片测试：ran asic 用 sv2v 与 yosys 展平出交付的 .v，测试台跑在 Verilator 上，程序用裸机的 RISC-V GCC 编；
      # Linux 镜像先在 QEMU 上过一遍
      apt: yosys gcc-riscv64-unknown-elf qemu-system-riscv
      # apt 那版 5.032 带 --timing 时，仲裁测试台跑到第二段，所有 always @(posedge clk) 都不再触发，
      # initial 里的 @(posedge clk) 照走；5.052 没有这个毛病
      verilator: v5.052
      pip: pyyaml
      sv2v: v0.0.13
